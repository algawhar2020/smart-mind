<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../css/style.css">
<style>html,body{height:auto!important;overflow:visible!important}body{padding:20px;background:#070B24}.sheet2{width:1100px;padding:28px;border-radius:24px;background:radial-gradient(120% 90% at 50% 0%,#131b52,#070B24);border:1px solid #223;margin-bottom:24px}
.sheet2 h2{margin:0 0 4px;font-size:30px}.sheet2 p{margin:0 0 16px;color:#93A0C8}.row{display:flex;gap:18px;align-items:flex-end}.st{flex:1;text-align:center;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:12px}
.st svg{width:100%;height:auto}.st b{font-size:22px;display:block}.st small{color:#93A0C8;font-size:14px}.arrow{font-size:34px;color:#93A0C8;align-self:center}
.all{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.all .st svg{width:100%}#logo{width:600px;text-align:center}#logo img{width:300px}#logo h1{font-size:44px;margin:10px 0 0;background:linear-gradient(90deg,#00D4FF,#39FF14,#B026FF);-webkit-background-clip:text;color:transparent}
#device{width:760px}</style></head><body>
<div id="out"></div>
<script src="../js/characters.js"></script><script src="../js/avatar.js"></script>
<script>
const out=document.getElementById('out');let h='';
for(const id of SM.ORDER){const c=SM.CHARACTERS[id];
h+=`<div class="sheet2" id="sheet-${id}" style="border-color:${c.color}55"><h2 style="color:${c.color}">${c.stages[1]} — ${c.kind}</h2><p>${c.trait} · اللون ${c.color} · مراحل التطور الثلاث</p><div class="row">`;
c.stages.forEach((s,i)=>{h+=(i?'<div class="arrow">←</div>':'')+`<div class="st">${SM.avatarSVG(id,i,{static:true})}<b style="color:${c.color}">${s}</b><small>${c.stageDesc[i]}</small></div>`});h+='</div></div>';}
h+=`<div class="sheet2" id="sheet-all"><h2>العقل الذكي — كل الشخصيات والمراحل</h2><p>ثاقب · غصن · رعد</p><div class="all">`;
for(let s=0;s<3;s++)for(const id of SM.ORDER){const c=SM.CHARACTERS[id];h+=`<div class="st">${SM.avatarSVG(id,s,{static:true})}<b style="color:${c.color}">${c.stages[s]}</b></div>`}
h+='</div></div>';
h+=`<div class="sheet2" id="logo"><img src="../icons/logo.svg"><h1>العقل الذكي</h1><p>Smart Mind · دماغ من الدوائر داخل شكل سداسي</p></div>`;
out.innerHTML=h;
</script>
